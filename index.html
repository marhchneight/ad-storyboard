    <script>
      // Applied before any CSS/React loads, so a saved dark preference never
      // flashes light first. No OS-preference fallback here on purpose —
      // first-time visitors should see this product's light baseline.
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
